<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rafting company home page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bla bla Rafting home page">
    <meta name="author" content="Ivan Veršić">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting site logo">
        <div id="logo"></div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>


    </header>

    <main>
        <div class="hero">
            <img src="images/rafting_wallpaper.jpg" alt="Site background">
            <h1> Welcome to Bla bla rafting. We are happy to offer you the best of rafting!</h1>
        </div>
        <section>
            <form class="contact-form">
                <div class="question">
                    <label for="question-1">Name</label>
                    <input type="text" id="question-1" name="question-1" placeholder="Name">
                </div>
                <div class="question">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email">
                </div>
                <button type="submit" class="button">Subscribe to our newsletter!</button>
            </form>
        </section>

        <section>
            <div class="adventure_title">
                <h2>What we offer</h2>
            </div>
            <div class="main-page_images">
                <figure>
                    <img src="images/river_rafting5.jpg" alt="Rafting photo from our recent trip">
                    <figcaption>Tours with modern boats</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting6.jpg" alt="Rafting photo from our recent trip">
                    <figcaption>Lessons for beginners</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer">
            <p>©2026, Bla bla rafting, Ivan Veršić</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.svg" alt="Facebook Icon">
                </a>
                <a href="https://linkedin.com">
                    <img src="images/linkedin.svg" alt="linkedIn Icon">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.svg" alt="Instagram Icon">
                </a>
            </nav>
        </div>
    </footer>


</body>

</html>
