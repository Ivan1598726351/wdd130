<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact page of the rafting company</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This is a website that includes the contact section of the rafting company.">
    <meta name="author" content="Ivan Veršić">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting site logo">
        <div id="logo"></div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>


    </header>

    <main>
        <h1 class="company-name">Bla bla rafting</h1>
        <h2 class="contact-info">Kaiserstraße 10</h2>
        <h2 class="contact-info">Frankfurt am Main, Germany</h2>
        <h2 class="contact-info">+49 000 000</h2>
        <h2 class="contact-info">info@bbllaabbllaa.com</h2>
        <section class="form-map">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2558.649593799944!2d8.6758928!3d50.1115654!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47bd0ea94a2c4409%3A0x35c4289acce21e9f!2sKaiserstra%C3%9Fe%2010%2C%2060311%20Frankfurt%20am%20Main%2C%20Germany!5e0!3m2!1sen!2shr!4v1785426708350!5m2!1sen!2shr"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form class="contact-form">
                <div class="question">
                    <label for="question-1">Name</label>
                    <input type="text" id="question-1" name="question-1" placeholder="Name">
                </div>
                <div class="question">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Email">
                </div>
                <fieldset class="question">
                    <legend>Message Purpose:</legend>
                    <div><label class="radio-option"><input type="radio" name="plan" value="basic"
                              required>
                            General Inquiry</label></div>
                    <div><label class="radio-option"><input type="radio" name="plan"
                              value="premium">
                            Reservation Question</label></div>
                    <div><label class="radio-option"><input type="radio" name="plan"
                              value="premium">
                            Website Suggestion</label></div>
                </fieldset>
                <div class="question">
                    <label for="question-4">Message</label>
                    <textarea id="question-4" name="question-4" placeholder="Type here"></textarea>
                </div>
                <div class="question">
                    <label for="question-5">Please subscribe me to the monthly newsletter</label>
                    <input type="checkbox" id="question-5" name="question-5">
                </div>
                <button type="submit" class="button">Get in Touch!</button>
            </form>
        </section>

        <section>
            <div class="adventure_title">
                <h2>We Are Here To Serve You!</h2>
            </div>
            <div class="employee_images">
                <figure>
                    <img src="images/employee1.jpg" alt="One of our employees">
                    <figcaption>Carl Johnson</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="One of our employees">
                    <figcaption>Melvin Harris</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="One of our employees">
                    <figcaption>Kendl Johnson</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer">
            <p>©2026, Bla bla rafting, Ivan Veršić</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.svg" alt="Facebook Icon">
                </a>
                <a href="https://linkedin.com">
                    <img src="images/linkedin.svg" alt="linkedIn Icon">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.svg" alt="Instagram Icon">
                </a>
            </nav>
        </div>
    </footer>


</body>

</html>
